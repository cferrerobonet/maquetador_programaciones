# Compila macOS (chip Apple) y Windows en GitHub, sin compilar nada en local.
#
#   · Al publicar una etiqueta vX.Y.Z: pruebas, compila las dos y las adjunta al release.
#     La app avisa sola de la versión nueva (actualizaciones.py).
#   · A mano desde la pestaña Actions: compila y deja los archivos para descargar.
name: Compilar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Adjuntar los archivos al release de la última etiqueta"
        type: boolean
        default: false
      plataforma:
        description: "Qué compilar"
        type: choice
        options: [todas, macos, windows]
        default: todas

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 fonts-dejavu-core
      - name: Versión coherente con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject.toml dice $v y la etiqueta ${GITHUB_REF_NAME}"; exit 1; }
      - name: Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests
          pytest

  windows:
    name: Instalador y portable de Windows
    needs: pruebas
    if: ${{ inputs.plataforma != 'macos' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar exe, instalador y .zip portable
        # pwsh lee los .ps1 como UTF-8; el powershell clásico rompería los acentos.
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: MaquetadorProgramaciones-Windows
          path: |
            Output/*.exe
            Output/*.zip
          if-no-files-found: error

  macos:
    name: DMG de macOS
    needs: pruebas
    if: ${{ inputs.plataforma != 'windows' }}
    runs-on: macos-latest   # chip Apple (arm64)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pyinstaller
      - name: Icono de macOS
        run: ./scripts/build/crear_icono.sh
      - name: Compilar app y DMG
        run: PY="$(which python)" ./scripts/build/build_dmg.sh
      # Que el DMG exista no basta: se arranca la app y tiene que llegar a la ventana.
      - name: Arrancar la app hasta la ventana principal
        run: |
          APP="dist/Maquetador de programaciones.app/Contents/MacOS/Maquetador de programaciones"
          MAQUETADOR_PRUEBA_DE_ARRANQUE=1 QT_QPA_PLATFORM=offscreen perl -e 'alarm 120; exec { $ARGV[0] } @ARGV' "$APP" | tee salida.txt
          grep -q "PRUEBA DE ARRANQUE: ventana principal a la vista" salida.txt
      - uses: actions/upload-artifact@v7
        with:
          name: MaquetadorProgramaciones-macOS
          path: "*.dmg"
          if-no-files-found: error

  publicar:
    name: Adjuntar al release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          etiqueta="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then etiqueta=$(git describe --tags --abbrev=0); fi
          archivos=$(find instaladores -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \))
          # Notas del release (las que enseña la ventana de actualización): la entrada de CHANGELOG.md.
          v="${etiqueta#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md || true
          [ -s notas.md ] || echo "Maquetador de programaciones $v" > notas.md
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" $archivos --clobber
          else
            gh release create "$etiqueta" $archivos --title "Maquetador de programaciones $v" --notes-file notas.md
          fi
