[project]
name = "maquetador-programaciones"
version = "0.1.1"
description = "Devuelve las programaciones didácticas con la maquetación de una programación de referencia"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carlos Ferrero Bonet" }]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "N"]
ignore = ["E501", "E731", "SIM105", "SIM117", "N802", "N806", "N818", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "BLE", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
